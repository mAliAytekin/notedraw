worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store";
            return 200 "ok\n";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Vite's content-hashed assets may be cached indefinitely.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # PDF.js assets keep their filenames across package upgrades.
        location ^~ /pdfjs/ {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        # Missing static files must not receive the SPA's HTML response.
        location ~* \.(?:m?js|css|map|json|wasm|woff2?|ttf|otf|svg|png|jpe?g|webp|gif|avif|ico|pdf)$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
